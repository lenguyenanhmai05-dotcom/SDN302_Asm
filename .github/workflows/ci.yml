name: CI Quality & Build Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Lint & Build Next.js Application
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "postgresql://postgres:mock_ci_password@localhost:5432/postgres?pgbouncer=true"
      DIRECT_URL: "postgresql://postgres:mock_ci_password@localhost:5432/postgres"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run ESLint
        run: npm run lint

      - name: Build Next.js project
        run: npm run build
